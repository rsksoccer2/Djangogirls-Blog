{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Django Girls blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>
    <header class="page-header">
      <div class="container">
          {% if user.is_authenticated %}
            <a href="{% url 'post_new' %}" class="top-menu">+ New</a>
            <a href="{% url 'post_draft_list' %}" class="top-menu">Drafts</a>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="top-menu" style="background:none; border:none; cursor:pointer; color:white; font-family: 'Lobster';">
                    Hello {{ user.username }} (Log out)
                </button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="top-menu">Log in</a>
          {% endif %}
          <h1><a href="/">Django Girls Blog</a></h1>
      </div>
    </header>
    <main class="container">
        <div class="row">
            <div class="col">
            {% block content %}
            {% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
